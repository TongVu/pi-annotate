<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Dashboard · Pi Chat</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Chat navigation">
      <div class="side-views">
        <div class="brand"><img src="/logo.png" width="24" height="24" alt="">Views</div>
        <nav aria-label="Views">
          <button class="nav-item" type="button" data-view="all" aria-current="true">All sessions</button>
          <button class="nav-item" type="button" data-view="attention">Needs attention</button>
          <button class="nav-item" type="button" data-view="bookmarks" hidden>Bookmarks</button>
          <details id="archive-view" hidden>
            <summary class="nav-item">Archive <span id="archive-count" class="meta"></span></summary>
            <p id="archive-empty" class="meta" hidden></p>
            <ul id="archived-sessions" aria-label="Archived chats" tabindex="0" hidden></ul>
          </details>
        </nav>
      </div>
      <div class="side-scroll">
        <div class="label">Projects</div>
        <nav id="projects" aria-label="Projects"></nav>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="heading">All sessions</h1>
          <p id="directory" class="directory" hidden>
            <span id="project-path"></span>
            <button id="copy-project-path" type="button" aria-label="Copy project path" title="Copy project path">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
            </button>
            <span id="project-path-status" role="status"></span>
          </p>
          <p id="summary" class="sub">Loading Pi sessions…</p>
        </div>
        <div class="dashboard-tools">
          <input id="session-filter" type="search" aria-label="Filter sessions by name or directory" placeholder="Name or directory" autocomplete="off">
          <button class="toolbar-icon" id="refresh" type="button" aria-label="Refresh chats" title="Refresh chats">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 4v5h-5M4 20v-5h5M20 9a8 8 0 0 0-14-3M4 15a8 8 0 0 0 14 3"/>
            </svg>
          </button>
          <button class="toolbar-icon" id="create-chat" type="button" aria-label="Create new chat" title="Create new chat" aria-haspopup="dialog" disabled>
            <span aria-hidden="true">📝</span>
          </button>
          <button class="toolbar-icon" id="focus-terminal" type="button" aria-label="Switch to Terminal" title="Switch to Terminal" hidden>
            <svg viewBox="0 0 240 240" width="22" height="22" aria-hidden="true">
              <rect x="3" y="3" width="234" height="234" rx="50" fill="#1c1f2a" stroke="#3b4255" stroke-width="6"/>
              <circle cx="36" cy="40" r="6" fill="#ff7070"/>
              <circle cx="58" cy="40" r="6" fill="#ffd46e"/>
              <circle cx="80" cy="40" r="6" fill="#47d98c"/>
              <path d="m54 96 50 40-50 40" fill="none" stroke="#5ce8d5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="126" y="166" width="64" height="16" rx="6" fill="#e2e4e9"/>
            </svg>
          </button>
        </div>
      </header>
      <div id="dashboard-scroll" role="region" aria-label="Session results" tabindex="0">
        <div class="status-overview">
          <div id="stats" class="stats" role="group" aria-label="Session counts"></div>
          <button id="clear-status-filter" type="button" aria-controls="sessions" hidden>Clear status filter</button>
        </div>
        <div id="notice" class="notice" hidden>
          <p id="message" role="status"></p>
          <div id="manual" hidden>
            <label for="command">Run this in Terminal, then run /chat in Pi</label>
            <input id="command" readonly>
            <button id="copy" class="accent" type="button">Copy</button>
          </div>
          <button id="dismiss" class="dismiss" type="button" aria-label="Dismiss message">×</button>
        </div>
        <div id="sessions"></div>
      </div>
      <footer id="legend" class="legend" aria-label="Status legend"></footer>
    </main>
  </div>
  <template id="pet-stage">
    <div class="pet-stage" aria-hidden="true">
      <span class="pet-shadow"></span>
      <svg class="pet-sprite" viewBox="0 -2 22 19" focusable="false">
        <g class="pet-robot">
          <g class="pet-antenna"><rect class="pet-shade" x="10.6" y="1.1" width=".8" height="3"/><rect class="pet-lamp" x="9.8" y="0" width="2.4" height="1.8"/></g>
          <path class="pet-shade" d="M6 13h2v2.5H6zM14 13h2v2.5h-2z"/>
          <path class="pet-body" d="M5 5h12v1h1v7h-1v1H5v-1H4V6h1z"/>
          <path class="pet-shade" d="M16.8 7h1.2v6h-1.2z"/>
          <rect class="pet-screen" x="5.7" y="7" width="10.6" height="4.2"/>
          <path class="pet-eyes" d="M7.3 7.9h1.65v2.25H7.3zM13.05 7.9h1.65v2.25h-1.65z"/>
          <path class="pet-face pet-happy" d="m7 9.45 1.15-1.15 1.15 1.15m3.4 0 1.15-1.15L15 9.45"/>
          <path class="pet-face pet-cross" d="m7.2 8 1.85 1.9m0-1.9-1.85 1.9M13 8l1.85 1.9m0-1.9L13 9.9"/>
          <path class="pet-face pet-sleep" d="M7.2 9.35h2m3.6 0h2"/>
          <g><rect class="pet-led" x="8.3" y="12" width="1" height="1"/><rect class="pet-led" x="10.5" y="12" width="1" height="1"/><rect class="pet-led" x="12.7" y="12" width="1" height="1"/></g>
          <path class="pet-hat" d="M8 2.6h6v1h1v1.9h2v.7h1v.9h-3V6.8H7v.3H4v-.9h1v-.7h2V3.6h1z"/>
          <path class="pet-brim" d="M7 4.75h8v.75H7zM5 6.5h2v.6H5zm10 0h2v.6h-2z"/>
          <rect class="pet-body pet-arm-left" x="1.9" y="8.9" width="2.2" height="2"/>
          <rect class="pet-body pet-arm-right" x="17.9" y="8.9" width="2.2" height="2"/>
          <g class="pet-keyboard"><rect class="pet-screen" x="5.1" y="13.25" width="11.8" height="1.9"/><path class="pet-key" d="M6 13.65h1v.6H6zm1.5 0h1v.6h-1zm1.5 0h1v.6H9zm1.5 0h1v.6h-1zm1.5 0h1v.6h-1zm1.5 0h1v.6h-1zm1.5 0h1v.6h-1z"/></g>
          <g class="pet-alarm"><path fill="currentColor" d="M17.7 1h3v3h-3z"/><path fill="white" d="M18.9 1.4h.6v1.2h-.6zm0 1.65h.6v.55h-.6z"/></g>
          <path class="pet-sleep-mark" fill="currentColor" d="M16.8 1h2.3v.52L17.6 3h1.5v.52h-2.3V3l1.5-1.48h-1.5z"/>
        </g>
        <g class="pet-archive"><path class="pet-hat" d="M5 8h12v7.5H5z"/><path class="pet-brim" d="M4.5 7h13v2.4h-13z"/><path fill="currentColor" d="M9 10.5h4v1H9z"/></g>
      </svg>
      <span class="pet-caption"></span>
      <span class="pet-indicators"></span>
    </div>
  </template>
  <template id="fork-directory-icon">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2 2h2"/>
      <path d="m13 13 8-8m-5 0h5v5"/>
    </svg>
  </template>
  <dialog id="new-chat-dialog" aria-labelledby="new-chat-heading" aria-describedby="directory-fork-description">
    <form id="new-chat-form" method="dialog">
      <h2 id="new-chat-heading">Create new chat</h2>
      <p id="directory-fork-description" hidden>The original chat stays in its current directory.</p>
      <label id="new-chat-project-label" for="new-chat-project">Which project should the chat be in?</label>
      <div class="project-picker">
        <input id="new-chat-project" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="new-chat-projects" placeholder="Search by project name or path" autocomplete="off" spellcheck="false" autofocus>
        <ul id="new-chat-projects" role="listbox" aria-label="Matching projects" hidden></ul>
        <p id="new-chat-no-projects" role="status" hidden>No projects match your search.</p>
      </div>
      <p id="new-chat-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-new-chat" type="button">Cancel</button>
        <button class="accent" id="submit-new-chat" type="submit" disabled>Create chat</button>
      </div>
    </form>
  </dialog>
</body>
</html>
