<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotate · Pi</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <div><strong id="page-title">Pi / Annotate</strong><p id="page-description">Select a passage, then add a question. Nothing is sent to the model here.</p></div>
    <span id="chat-state" role="status" hidden></span>
    <button id="send" disabled>Add to Pi draft <span id="count">(0)</span></button>
  </header>
  <p id="status" role="status" aria-live="polite">Loading response…</p>
  <main>
    <nav id="turns" aria-label="Jump to a message you sent" hidden></nav>
    <article id="conversation" aria-label="Assistant response">
      <div class="label" id="conversation-label">ASSISTANT RESPONSE <span>· Rendered Markdown</span></div>
      <div id="response" tabindex="0"></div>
      <form id="chat-form" hidden>
        <div class="chat-composer">
          <textarea id="chat-input" aria-label="Message" rows="2" maxlength="32000" placeholder="Write a message or paste a screenshot…"></textarea>
          <input id="chat-file" type="file" multiple hidden>
          <ul id="chat-attachments" aria-label="Files in your draft" hidden></ul>
          <div class="actions">
            <button id="chat-attach" type="button" class="secondary" title="Attach text files or images">Attach files</button>
            <button id="chat-send" type="submit" aria-label="Send message" title="Send message (Enter)" disabled>
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 2 15 22 11 13 2 9 22 2ZM22 2 11 13"/>
              </svg>
            </button>
          </div>
        </div>
      </form>
    </article>
    <aside aria-label="Annotations"><h2>Your annotations</h2><p id="empty">Highlight words in the response to ask about them.</p><ol id="annotations"></ol></aside>
  </main>
  <dialog id="comment-dialog" aria-labelledby="comment-title">
    <form id="comment-form">
      <h2 id="comment-title">Ask about this passage</h2>
      <blockquote id="selected-quote"></blockquote>
      <label for="comment">Question or comment</label>
      <textarea id="comment" rows="4" maxlength="8000" required placeholder="What would you like to ask?"></textarea>
      <div class="actions"><button id="cancel" type="button" class="secondary">Cancel</button><button type="submit">Add annotation</button></div>
    </form>
  </dialog>
</body>
</html>
