<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Dashboard · Pi Chat</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Chat navigation">
      <div class="brand"><img src="/logo.png" width="24" height="24" alt="">Projects</div>
      <div class="side-scroll">
        <nav id="projects" aria-label="Projects"></nav>
        <div class="label">Views</div>
        <nav aria-label="Views">
          <button class="nav-item" type="button" data-view="all" aria-current="true">All sessions</button>
          <button class="nav-item" type="button" data-view="attention">Needs attention</button>
          <button class="nav-item" type="button" data-view="bookmarks" hidden>Bookmarks</button>
        </nav>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="heading">All sessions</h1>
          <p id="directory" class="directory" hidden></p>
          <p id="summary" class="sub">Loading Pi sessions…</p>
        </div>
        <div class="dashboard-tools">
          <input id="session-filter" type="search" aria-label="Filter sessions by name or directory" placeholder="Name or directory" autocomplete="off">
          <button class="toolbar-icon" id="refresh" type="button" aria-label="Refresh chats" title="Refresh chats">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 4v5h-5M4 20v-5h5M20 9a8 8 0 0 0-14-3M4 15a8 8 0 0 0 14 3"/>
            </svg>
          </button>
          <button class="toolbar-icon" id="create-chat" type="button" aria-label="Create new chat" title="Create new chat" aria-haspopup="dialog" disabled>
            <span aria-hidden="true">📝</span>
          </button>
          <button class="toolbar-icon" id="focus-terminal" type="button" aria-label="Switch to Terminal" title="Switch to Terminal" hidden>
            <span aria-hidden="true">🕹️</span>
          </button>
        </div>
      </header>
      <div id="dashboard-scroll" role="region" aria-label="Session results" tabindex="0">
        <div id="stats" class="stats" aria-label="Session counts"></div>
        <div id="notice" class="notice" hidden>
          <p id="message" role="status"></p>
          <div id="manual" hidden>
            <label for="command">Run this in Terminal, then run /chat in Pi</label>
            <input id="command" readonly>
            <button id="copy" class="accent" type="button">Copy</button>
          </div>
          <button id="dismiss" class="dismiss" type="button" aria-label="Dismiss message">×</button>
        </div>
        <div id="sessions"></div>
      </div>
      <footer id="legend" class="legend" aria-label="Status legend"></footer>
    </main>
  </div>
  <dialog id="new-chat-dialog" aria-labelledby="new-chat-heading">
    <form id="new-chat-form" method="dialog">
      <h2 id="new-chat-heading">Create new chat</h2>
      <label for="new-chat-project">Which project should the chat be in?</label>
      <div class="project-picker">
        <input id="new-chat-project" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="new-chat-projects" placeholder="Search by project name or path" autocomplete="off" spellcheck="false" autofocus>
        <ul id="new-chat-projects" role="listbox" aria-label="Matching projects" hidden></ul>
        <p id="new-chat-no-projects" role="status" hidden>No projects match your search.</p>
      </div>
      <p id="new-chat-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-new-chat" type="button">Cancel</button>
        <button class="accent" id="submit-new-chat" type="submit" disabled>Create chat</button>
      </div>
    </form>
  </dialog>
</body>
</html>
