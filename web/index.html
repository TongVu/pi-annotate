<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotate · Pi</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <div id="page-intro"><strong>Pi / Annotate</strong><p>Select a passage, then add a question. Nothing is sent to the model here.</p></div>
    <button id="send" disabled>Add to Pi draft <span id="count">(0)</span></button>
  </header>
  <p id="status" role="status" aria-live="polite">Loading response…</p>
  <nav id="chat-explorer" aria-label="Chat explorer" hidden>
    <div class="explorer-tools">
      <div id="project-view-controls" role="group" aria-label="Project folder view">
        <button type="button" data-mode="collapse" aria-pressed="false" aria-label="Collapse all" title="Collapse all">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l6 6m-5 0h5V5m10-1-6 6m0-5v5h5M4 20l6-6m-5 0h5v5m10 1-6-6m0 5v-5h5"/></svg>
        </button>
        <button type="button" data-mode="normal" aria-pressed="true" aria-label="Normal" title="Normal">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
        </button>
        <button type="button" data-mode="expand" aria-pressed="false" aria-label="Expand all" title="Expand all">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5m0-5 6 6m5-6h5v5m0-5-6 6M4 15v5h5m-5 0 6-6m5 6h5v-5m0 5-6-6"/></svg>
        </button>
      </div>
      <button id="refresh-sessions" type="button" class="secondary" aria-label="Refresh chats" title="Refresh chats">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 4v5h-5M4 20v-5h5M20 9a8 8 0 0 0-14-3M4 15a8 8 0 0 0 14 3"/>
        </svg>
      </button>
      <div class="session-search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"/>
          <path d="m16 16 4.5 4.5"/>
        </svg>
        <input id="session-filter" type="search" aria-label="Search chats by name or directory" placeholder="Name or directory" autocomplete="off">
      </div>
    </div>
    <p id="explorer-status" role="status"></p>
    <div id="session-list"></div>
  </nav>
  <main>
    <div id="chat-rail" hidden>
      <button id="explorer-toggle" type="button" class="secondary" aria-label="Toggle chat explorer" title="Toggle chat explorer" aria-expanded="false" aria-controls="chat-explorer" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M9 4v16"/>
        </svg>
      </button>
      <nav id="turns" aria-label="Jump to a message you sent" hidden></nav>
    </div>
    <article id="conversation" aria-label="Assistant response">
      <div class="label" id="conversation-label">ASSISTANT RESPONSE <span>· Rendered Markdown</span></div>
      <div id="response" tabindex="0">
        <div id="session-title-pill" class="session-title-pill" hidden>
          <span id="session-title-text"></span>
          <button id="rename-session" type="button" class="secondary" aria-label="Rename chat" title="Rename chat">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 4 4 4M4 20l4-.8L19 8a2.8 2.8 0 0 0-4-4L4 15z"/></svg>
          </button>
        </div>
      </div>
      <form id="chat-form" hidden>
        <div class="chat-composer">
          <button id="chat-expand" type="button" class="secondary composer-icon" aria-label="Expand message composer" aria-controls="chat-input" aria-expanded="false" title="Expand message composer">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path class="expand-icon" d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7"/>
              <path class="collapse-icon" d="M21 3l-7 7m0-6v6h6M3 21l7-7m-6 0h6v6"/>
            </svg>
          </button>
          <textarea id="chat-input" aria-label="Message" rows="2" maxlength="32000" placeholder="Write a message or paste a screenshot…"></textarea>
          <input id="chat-file" type="file" multiple hidden>
          <ul id="chat-attachments" class="attachment-list" aria-label="Files in your draft" hidden></ul>
          <div class="actions">
            <span id="chat-state" role="status" hidden><span class="chat-state-icon" aria-hidden="true"></span><span class="chat-state-label"></span></span>
            <button id="chat-attach" type="button" class="secondary composer-icon" aria-label="Attach files" title="Attach text files or images">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5L14.3 1.2A4 4 0 0 1 20 6.9L9.4 17.5a2 2 0 0 1-2.8-2.8l9.9-9.9"/>
              </svg>
            </button>
            <button id="chat-send" type="submit" class="composer-icon" aria-label="Send message" title="Send message (Enter)" disabled>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 2 15 22 11 13 2 9 22 2ZM22 2 11 13"/>
              </svg>
            </button>
          </div>
        </div>
      </form>
    </article>
    <section id="saved-conversation" aria-labelledby="saved-title" hidden>
      <div class="saved-heading">
        <div><h2 id="saved-title"></h2><p id="saved-directory"></p></div>
        <div class="saved-actions">
          <button id="open-saved-chat" type="button" hidden>Resume in browser</button>
          <button id="back-to-live" type="button" class="secondary">Back to live chat</button>
        </div>
      </div>
      <p id="saved-status" role="status"></p>
      <div id="saved-response" tabindex="0" aria-label="Saved conversation"></div>
    </section>
    <aside id="annotations-panel" aria-label="Annotations"><h2>Your annotations</h2><p id="empty">Highlight words in the response to ask about them.</p><ol id="annotations"></ol></aside>
  </main>
  <dialog id="rename-session-dialog" aria-labelledby="rename-session-title">
    <form id="rename-session-form">
      <h2 id="rename-session-title">Rename chat</h2>
      <label for="rename-session-input">Session name</label>
      <input id="rename-session-input" type="text" maxlength="100" required autocomplete="off">
      <p id="rename-session-status" role="status"></p>
      <div class="actions"><button id="cancel-rename-session" type="button" class="secondary">Cancel</button><button id="save-session-name" type="submit">Save name</button></div>
    </form>
  </dialog>
  <dialog id="resume-command-dialog" aria-labelledby="resume-command-title">
    <h2 id="resume-command-title">Resume command</h2>
    <label for="resume-command">Copy this command into your terminal:</label>
    <textarea id="resume-command" readonly rows="3"></textarea>
    <div class="actions"><button id="close-resume-command" type="button" class="secondary">Close</button></div>
  </dialog>
  <dialog id="image-preview" aria-labelledby="preview-title">
    <h2 id="preview-title"></h2>
    <img id="preview-image" alt="">
    <div class="actions"><button id="close-preview" type="button" class="secondary" autofocus>Close preview</button></div>
  </dialog>
  <dialog id="comment-dialog" aria-labelledby="comment-title">
    <form id="comment-form">
      <div class="comment-dialog-header">
        <h2 id="comment-title">Ask about this passage</h2>
        <button id="comment-close" type="button" class="secondary comment-icon" aria-label="Close annotation" title="Close annotation">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <blockquote id="selected-quote"></blockquote>
      <label for="comment">Question or comment</label>
      <div class="comment-composer">
        <textarea id="comment" rows="4" maxlength="8000" required placeholder="What would you like to ask?"></textarea>
        <div class="comment-composer-actions">
          <div id="comment-images" hidden>
            <input id="comment-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            <ul id="comment-attachments" class="attachment-list" aria-label="Images for this annotation" hidden></ul>
            <button id="comment-attach" type="button" class="secondary composer-icon" aria-label="Attach images" title="Attach images or paste them into the comment">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5L14.3 1.2A4 4 0 0 1 20 6.9L9.4 17.5a2 2 0 0 1-2.8-2.8l9.9-9.9"/>
              </svg>
            </button>
            <p id="comment-file-status" role="status"></p>
          </div>
          <button id="save-annotation" type="submit" class="composer-icon" aria-label="Add annotation" title="Add annotation">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
        </div>
      </div>
    </form>
  </dialog>
</body>
</html>
